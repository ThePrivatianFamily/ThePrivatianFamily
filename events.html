<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function(){
      try {
        var p = new URLSearchParams(window.location.search);
        var l = p.get('lang') || localStorage.getItem('privatian_site_lang');
        if (l === 'bn') {
          document.documentElement.lang = 'bn';
          document.documentElement.setAttribute('data-lang', 'bn');
          document.documentElement.classList.add('lang-bn');
        } else {
          document.documentElement.lang = 'en';
          document.documentElement.setAttribute('data-lang', 'en');
          document.documentElement.classList.add('lang-en');
        }
      } catch(e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events &amp; Gatherings — The Privatian Family</title>
  <meta name="description" content="Explore upcoming events, debates, lectures, and gatherings across The Privatian Family community." />
  <base href="/" />
  <link rel="preload" href="/fonts/hind-siliguri-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/hind-siliguri-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/hind-siliguri-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/noto-serif-bengali-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Bengali:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=2.5" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/supabase-config.js?v=2.5" defer></script>
  <script src="/lang.js?v=2.5" defer></script>
  <script src="/components.js?v=2.5" defer></script>
  <style>
    :root {
      --ev-navy: #0a2540;
      --ev-gold: #c9a96e;
      --ev-blue: #0a528e;
      --ev-border: #e2e8f0;
      --ev-bg: #f8fafc;
    }

    body {
      background: #f8fafc;
    }

    /* ── IDENTITY HEADER BAR ── */
    .events-hero-bar {
      background: #0a2540;
      border-bottom: 3px solid #c9a96e;
      padding: 44px 24px 38px;
    }

    .events-hero-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
    }

    .events-crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }

    .events-crumb a {
      color: #c9a96e;
      text-decoration: none;
    }

    .events-crumb a:hover {
      text-decoration: underline;
    }

    .events-hero-title {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px;
      line-height: 1.2;
    }

    .events-hero-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      max-width: 600px;
      margin: 0;
      line-height: 1.5;
    }

    .events-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201,169,110,0.15);
      border: 1px solid rgba(201,169,110,0.3);
      color: #c9a96e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── MAIN CONTENT CONTAINER ── */
    .events-main-wrap {
      max-width: var(--max-width);
      margin: 40px auto 60px;
      padding: 0 24px;
    }

    /* ── EVENTS LIST ── */
    .events-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .event-card {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      align-items: center;
      gap: 28px;
      background: #ffffff;
      border: 1px solid var(--ev-border);
      border-radius: 10px;
      padding: 24px 28px;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
    }

    .event-card:hover {
      box-shadow: 0 8px 24px rgba(10,37,64,0.08);
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }

    .event-date-box {
      background: #f1f5f9;
      border: 1px solid var(--ev-border);
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
    }

    .event-date-text {
      font-family: var(--font-serif);
      font-size: 13px;
      font-weight: 700;
      color: var(--ev-navy);
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .event-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-title {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--ev-navy);
      margin: 0;
      line-height: 1.35;
    }

    .event-title a {
      color: inherit;
      text-decoration: none;
    }

    .event-title a:hover {
      color: var(--ev-blue);
    }

    .event-meta-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    .event-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ev-navy);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .event-btn:hover {
      background: #0d3a63;
      color: #ffffff;
    }

    .events-empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border: 1px dashed var(--ev-border);
      border-radius: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <span class="font-preloader" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none;font-family:'Noto Serif Bengali','Hind Siliguri';">অআইঈকখগদ্যপ্রাইভেটিয়ানফ্যামিলি</span>
  <!-- HEADER MOUNT -->
  <div id="site-header-mount"></div>
  <script defer>if(window.initPrivatianHeader) window.initPrivatianHeader();</script>

  <!-- HERO IDENTITY BAR -->
  <header class="events-hero-bar">
    <div class="events-hero-inner">
      <div>
        <nav class="events-crumb" aria-label="Breadcrumb">
          <a href="index.html" id="ev-crumb-home">Home</a>
          <span>&rsaquo;</span>
          <span id="ev-crumb-current">Events</span>
        </nav>
        <h1 class="events-page-title" id="ev-page-title">Events &amp; Gatherings</h1>
        <p class="events-page-subtitle" id="ev-page-sub">Debates, intellectual salons, cultural retrospectives, and private forums from The Privatian Family.</p>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="events-container">
    <div class="events-filter-bar">
      <div class="events-count-badge" id="ev-count-badge">Showing <strong id="events-count-display">0</strong> Scheduled Events</div>
    </div>

    <div class="events-grid" id="events-grid-container">
      <!-- Injected via JavaScript from Supabase / cache -->
    </div>
  </main>

  <!-- FOOTER MOUNT -->
  <div id="site-footer-mount"></div>

  <script>
    (function () {
      'use strict';

      var _cachedEvents = [];

      function renderEvents(events) {
        if (events) _cachedEvents = events;
        var container = document.getElementById('events-grid-container');
        var countEl = document.getElementById('events-count-display');
        var countBadgeEl = document.getElementById('ev-count-badge');
        var isBn = window.PrivatianLang && window.PrivatianLang.getLang() === 'bn';

        var crumbHome = document.getElementById('ev-crumb-home');
        if (crumbHome) crumbHome.textContent = isBn ? 'মূল পাতা' : 'Home';

        var crumbCur = document.getElementById('ev-crumb-current');
        if (crumbCur) crumbCur.textContent = isBn ? 'ইভেন্ট ও আয়োজন' : 'Events';

        var titleEl = document.getElementById('ev-page-title');
        if (titleEl) titleEl.textContent = isBn ? 'ইভেন্ট ও আয়োজন' : 'Events & Gatherings';

        var subEl = document.getElementById('ev-page-sub');
        if (subEl) subEl.textContent = isBn ? 'দ্য প্রাইভেটিয়ান ফ্যামিলির বুদ্ধিবৃত্তিক আলোচনা, বিতর্ক, সাংস্কৃতিক সম্মিলন এবং বিশেষ সেমিনার।' : 'Debates, intellectual salons, cultural retrospectives, and private forums from The Privatian Family.';

        var pick = function(en, bn) {
          if (window.PrivatianLang && window.PrivatianLang.pickLang) {
            return window.PrivatianLang.pickLang(en, bn);
          }
          return isBn ? (bn || en) : en;
        };

        if (!container) return;

        var activeEvents = (_cachedEvents || []).filter(function(e) { return e && e.enabled !== false; });
        var countFormatted = isBn ? (window.PrivatianLang ? window.PrivatianLang.toBengaliNumber(activeEvents.length) : activeEvents.length) : activeEvents.length;

        if (countBadgeEl) {
          countBadgeEl.innerHTML = isBn ? (countFormatted + ' টি নির্ধারিত ইভেন্ট প্রদর্শিত হচ্ছে') : ('Showing <strong id="events-count-display">' + countFormatted + '</strong> Scheduled Events');
        }

        if (activeEvents.length === 0) {
          container.innerHTML = '<div class="events-empty-state"><p style="font-size:16px;font-weight:600;margin:0 0 6px;">' + (isBn ? 'বর্তমানে কোনো নির্ধারিত ইভেন্ট নেই।' : 'No upcoming events currently scheduled.') + '</p><p style="font-size:13px;margin:0;">' + (isBn ? 'আমাদের সাম্প্রতিক সেমিনার ও আলোচনার জন্য শীঘ্রই আবার দেখুন।' : 'Please check back soon for our latest forum discussions and intellectual gatherings.') + '</p></div>';
          return;
        }

        container.innerHTML = activeEvents.map(function(ev) {
          var date = pick(ev.date, ev.date_bn || (window.PrivatianLang ? window.PrivatianLang.toBengaliNumber(ev.date) : ev.date));
          var title = pick(ev.title, ev.title_bn);
          var meta = pick(ev.meta, ev.meta_bn);
          var link = ev.href || 'index.html#events';
          var btnText = isBn ? 'ইভেন্টের বিবরণী &rarr;' : 'Event Details &rarr;';

          return '<article class="event-card">' +
            '<div class="event-date-box">' +
              '<span class="event-date-text">' + escapeHtml(date) + '</span>' +
            '</div>' +
            '<div class="event-content">' +
              '<h2 class="event-title"><a href="' + escapeHtml(link) + '">' + escapeHtml(title) + '</a></h2>' +
              (meta ? '<div class="event-meta-info"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + escapeHtml(meta) + '</div>' : '') +
            '</div>' +
            '<div>' +
              '<a href="' + escapeHtml(link) + '" class="event-btn">' + btnText + '</a>' +
            '</div>' +
          '</article>';
        }).join('');
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // Fetch live from database
      async function loadLiveEvents() {
        var isBn = window.PrivatianLang && window.PrivatianLang.getLang() === 'bn';
        var cfg = null;
        try {
          var r = await fetch('/api/sections?action=homepage' + (isBn ? '&lang=bn' : ''));
          if (r.ok) cfg = await r.json();
        } catch(err) {}

        if (!cfg || !cfg.eventsSection) {
          try {
            var sb = window._sb || (window.initSupabaseClient && window.initSupabaseClient());
            if (sb) {
              var targetId = isBn ? '__homepage_config_bn__' : '__homepage_config__';
              var { data: sData } = await sb.from('sections').select('name').eq('admin_id', targetId).maybeSingle();
              if (sData && sData.name) {
                var parsed = JSON.parse(sData.name);
                if (parsed && typeof parsed === 'object') cfg = parsed;
              }
            }
          } catch(e) {}
        }

        if (cfg && cfg.eventsSection && Array.isArray(cfg.eventsSection.events)) {
          renderEvents(cfg.eventsSection.events);
        }
      }

      loadLiveEvents();

      // 3. Reactive listener for language changes
      document.addEventListener('privatian:language-changed', function() {
        loadLiveEvents();
      });
    })();
  </script>
