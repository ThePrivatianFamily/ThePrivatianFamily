<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events &amp; Gatherings — The Privatian Family</title>
  <meta name="description" content="Explore upcoming events, debates, lectures, and gatherings across The Privatian Family community." />
  <base href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Bengali:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/lang.js"></script>
  <script src="/components.js"></script>
  <style>
    :root {
      --ev-navy: #0a2540;
      --ev-gold: #c9a96e;
      --ev-blue: #0a528e;
      --ev-border: #e2e8f0;
      --ev-bg: #f8fafc;
    }

    body {
      background: #f8fafc;
    }

    /* ── IDENTITY HEADER BAR ── */
    .events-hero-bar {
      background: #0a2540;
      border-bottom: 3px solid #c9a96e;
      padding: 44px 24px 38px;
    }

    .events-hero-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }

    .events-crumb {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #c9a96e;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .events-crumb a {
      color: inherit;
      text-decoration: none;
    }

    .events-crumb a:hover {
      color: #fff;
    }

    .events-page-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
      margin: 0 0 8px;
    }

    .events-page-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 620px;
      line-height: 1.5;
      margin: 0;
    }

    /* ── MAIN CONTENT CONTAINER ── */
    .events-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .events-filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--ev-border);
      padding-bottom: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .events-count-badge {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
    }

    .events-count-badge strong {
      color: #0a2540;
    }

    /* ── EVENTS LIST GRID ── */
    .events-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .event-card {
      background: #ffffff;
      border: 1px solid var(--ev-border);
      border-radius: 12px;
      padding: 24px;
      display: grid;
      grid-template-columns: 140px 1fr auto;
      gap: 28px;
      align-items: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    @media (max-width: 860px) {
      .event-card {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .event-card:hover {
      border-color: var(--ev-blue);
      box-shadow: 0 8px 24px rgba(10, 82, 142, 0.08);
      transform: translateY(-2px);
    }

    .event-date-box {
      background: #0a2540;
      color: #ffffff;
      border-radius: 8px;
      padding: 16px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-top: 3px solid #c9a96e;
    }

    .event-date-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    .event-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin: 0;
    }

    .event-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s;
    }

    .event-title a:hover {
      color: var(--ev-blue);
      text-decoration: underline;
    }

    .event-meta-info {
      font-size: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: #0a528e;
      color: #ffffff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .event-btn:hover {
      background: #0d3a63;
      color: #ffffff;
    }

    .events-empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border: 1px dashed var(--ev-border);
      border-radius: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <!-- HEADER MOUNT -->
  <div id="site-header-mount"></div>
  <script>if(window.initPrivatianHeader) window.initPrivatianHeader();</script>

  <!-- HERO IDENTITY BAR -->
  <header class="events-hero-bar">
    <div class="events-hero-inner">
      <div>
        <nav class="events-crumb" aria-label="Breadcrumb">
          <a href="index.html" id="ev-crumb-home">Home</a>
          <span>&rsaquo;</span>
          <span id="ev-crumb-current">Events</span>
        </nav>
        <h1 class="events-page-title" id="ev-page-title">Events &amp; Gatherings</h1>
        <p class="events-page-subtitle" id="ev-page-sub">Debates, intellectual salons, cultural retrospectives, and private forums from The Privatian Family.</p>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="events-container">
    <div class="events-filter-bar">
      <div class="events-count-badge" id="ev-count-badge">Showing <strong id="events-count-display">0</strong> Scheduled Events</div>
    </div>

    <div class="events-grid" id="events-grid-container">
      <!-- Injected via JavaScript from Supabase / cache -->
    </div>
  </main>

  <!-- FOOTER MOUNT -->
  <div id="site-footer-mount"></div>

  <script>
    (function () {
      'use strict';

      var _cachedEvents = [];

      function renderEvents(events) {
        if (events) _cachedEvents = events;
        var container = document.getElementById('events-grid-container');
        var countEl = document.getElementById('events-count-display');
        var countBadgeEl = document.getElementById('ev-count-badge');
        var isBn = window.PrivatianLang && window.PrivatianLang.getLang() === 'bn';

        var crumbHome = document.getElementById('ev-crumb-home');
        if (crumbHome) crumbHome.textContent = isBn ? 'মূল পাতা' : 'Home';

        var crumbCur = document.getElementById('ev-crumb-current');
        if (crumbCur) crumbCur.textContent = isBn ? 'অনুষ্ঠানসমূহ' : 'Events';

        var titleEl = document.getElementById('ev-page-title');
        if (titleEl) titleEl.textContent = isBn ? 'অনুষ্ঠান ও সম্মিলনীসমূহ' : 'Events & Gatherings';

        var subEl = document.getElementById('ev-page-sub');
        if (subEl) subEl.textContent = isBn ? 'প্রাইভেসিয়ান পরিবারের বুদ্ধিবৃত্তিক আলোচনা, বিতর্ক, সাংস্কৃতিক সম্মিলন এবং বিশেষ সেমিনার।' : 'Debates, intellectual salons, cultural retrospectives, and private forums from The Privatian Family.';

        var pick = function(en, bn) {
          if (window.PrivatianLang && window.PrivatianLang.pickLang) {
            return window.PrivatianLang.pickLang(en, bn);
          }
          return isBn ? (bn || en) : en;
        };

        if (!container) return;

        var activeEvents = (_cachedEvents || []).filter(function(e) { return e && e.enabled !== false; });
        var countFormatted = isBn ? (window.PrivatianLang ? window.PrivatianLang.toBengaliNumber(activeEvents.length) : activeEvents.length) : activeEvents.length;

        if (countBadgeEl) {
          countBadgeEl.innerHTML = isBn ? (countFormatted + ' টি নির্ধারিত অনুষ্ঠান প্রদর্শিত হচ্ছে') : ('Showing <strong id="events-count-display">' + countFormatted + '</strong> Scheduled Events');
        }

        if (activeEvents.length === 0) {
          container.innerHTML = '<div class="events-empty-state"><p style="font-size:16px;font-weight:600;margin:0 0 6px;">' + (isBn ? 'বর্তমানে কোনো নির্ধারিত অনুষ্ঠান নেই।' : 'No upcoming events currently scheduled.') + '</p><p style="font-size:13px;margin:0;">' + (isBn ? 'আমাদের সাম্প্রতিক সেমিনার ও আলোচনার জন্য শীঘ্রই আবার দেখুন।' : 'Please check back soon for our latest forum discussions and intellectual gatherings.') + '</p></div>';
          return;
        }

        container.innerHTML = activeEvents.map(function(ev) {
          var date = pick(ev.date, ev.date_bn || (window.PrivatianLang ? window.PrivatianLang.toBengaliNumber(ev.date) : ev.date));
          var title = pick(ev.title, ev.title_bn);
          var meta = pick(ev.meta, ev.meta_bn);
          var link = ev.href || 'index.html#events';
          var btnText = isBn ? 'অনুষ্ঠানের বিবরণী &rarr;' : 'Event Details &rarr;';

          return '<article class="event-card">' +
            '<div class="event-date-box">' +
              '<span class="event-date-text">' + escapeHtml(date) + '</span>' +
            '</div>' +
            '<div class="event-content">' +
              '<h2 class="event-title"><a href="' + escapeHtml(link) + '">' + escapeHtml(title) + '</a></h2>' +
              (meta ? '<div class="event-meta-info"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + escapeHtml(meta) + '</div>' : '') +
            '</div>' +
            '<div>' +
              '<a href="' + escapeHtml(link) + '" class="event-btn">' + btnText + '</a>' +
            '</div>' +
          '</article>';
        }).join('');
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // 1. Immediate cache render
      try {
        var raw = localStorage.getItem('privatian_homepage_settings');
        if (raw) {
          var cfg = JSON.parse(raw);
          if (cfg && cfg.eventsSection && Array.isArray(cfg.eventsSection.events)) {
            renderEvents(cfg.eventsSection.events);
          }
        }
      } catch(e) {}

      // 2. Fetch live from database
      fetch('/api/sections?action=homepage')
        .then(function(r) { return r.json(); })
        .then(function(cfg) {
          if (cfg && cfg.eventsSection && Array.isArray(cfg.eventsSection.events)) {
            try { localStorage.setItem('privatian_homepage_settings', JSON.stringify(cfg)); } catch(e) {}
            renderEvents(cfg.eventsSection.events);
          }
        })
        .catch(function(err) {
          console.warn('[Events Page] Database fetch fallback:', err);
        });

      // 3. Reactive listener for language changes
      document.addEventListener('privatian:language-changed', function() {
        renderEvents();
      });
    })();
  </script>
</body>
</html>
