  <style>
    /* Hide hardcoded placeholders when loading a real article */
    .article-loading #article-hero-band,
    .article-loading #article-layout,
    .article-loading #article-related { opacity: 0; pointer-events: none; }
    .article-reveal #article-hero-band,
    .article-reveal #article-layout,
    .article-reveal #article-related {
      opacity: 1;
      transition: opacity 0.38s ease;
    }
    /* Skeleton shimmer */
    @keyframes _shimmer { 0%{background-position:-600px 0} 100%{background-position:600px 0} }
    .article-skeleton-bar {
      background: linear-gradient(90deg,#e8edf2 25%,#f4f6f8 50%,#e8edf2 75%);
      background-size: 1200px 100%;
      animation: _shimmer 1.4s infinite linear;
      border-radius: 4px;
      display: block;
    }
    #article-skeleton {
      max-width: 680px; margin: 48px auto; padding: 0 24px;
    }
  </style>
  <script>
    // Apply loading class immediately if article params present
    (function(){
      var p = new URLSearchParams(location.search);
      var hasSlugInPath = location.pathname.startsWith('/article/') && location.pathname.length > 9;
      if (p.get('id') || p.get('slug') || hasSlugInPath) document.documentElement.classList.add('article-loading-pending');
    })();
  </script>
</head>

  <script>
  /* ── Dynamic article loader ── */
  (function(){
    var params = new URLSearchParams(location.search);
    var id   = params.get('id');
    var slug = params.get('slug');
    var isPreview = params.get('preview') === '1';

    if (!id && !slug) {
      var match = location.pathname.match(/\/article\/([^\/\?#]+)/);
      if (match && match[1] && match[1] !== 'article.html' && match[1] !== 'article') {
        var raw = decodeURIComponent(match[1]);
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw) || raw.startsWith('art_')) {
          id = raw;
        } else {
          slug = raw;
        }
      }
    }

    // If no article ID/slug specified, redirect to home page
    if (!id && !slug) {
      window.location.replace('/');
      return;
    }

    // If article is requested by ID or preview mode -> Strictly require Admin login
    if (id || isPreview) {
      var tok = '';
      try { tok = localStorage.getItem('privatian_token'); } catch(e){}
      if (!tok) {
        try {
          sessionStorage.setItem('login_message', 'Admin access required to view draft previews and private article IDs.');
        } catch(e){}
        window.location.replace('/admin-login.html');
        return;
      }
    }

    function g(i){ return document.getElementById(i); }
    function fmt(iso){
      if(!iso) return '';
      var d = new Date(iso);
      return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    }
    function readTime(html){
      var txt = (html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      var words = txt ? txt.split(' ').filter(Boolean).length : 0;
      return Math.max(1, Math.round(words / 200));
    }
    function slugify(name){
      return (name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    }

    // ── Hide placeholder content immediately, show skeleton ──
    document.body.classList.add('article-loading');
    var sk = g('article-skeleton');
    if (sk) sk.style.display = 'block';

    function revealPage() {
      var sk = g('article-skeleton');
      if (sk) sk.style.display = 'none';
      document.body.classList.remove('article-loading');
      document.body.classList.add('article-reveal');
    }

    async function fetchArticleData() {
      var url = '/api/articles?action=public-get';
      if (id)   url += '&id='   + encodeURIComponent(id);
      if (slug) url += '&slug=' + encodeURIComponent(slug);
      if (isPreview) url += '&preview=1';

      var fetchHeaders = {};
      try {
        var tok = localStorage.getItem('privatian_token');
        if (tok) fetchHeaders['Authorization'] = 'Bearer ' + tok;
      } catch(e){}

      try {
        var r = await fetch(url, { headers: fetchHeaders });
        if (r.status === 401 || r.status === 403) {
          if (id || isPreview) {
            try {
              localStorage.removeItem('privatian_token');
              sessionStorage.setItem('login_message', 'Admin session expired. Please sign in to view draft previews.');
            } catch(e){}
            window.location.replace('/admin-login.html');
            return;
          }
        }
        if (r.ok) {
          var data = await r.json();
          if (data && data.title) {
            if (slug && data.status !== 'published') {
              throw new Error('This article is currently in draft mode or unpublished.');
            }
            return data;
          }
        }
      } catch(e) {
        if (e.message && e.message.includes('draft')) throw e;
      }

      // Supabase Client Fallback for public slug only
      if (!id && slug) {
        try {
          var sb = window._sb || (window.initSupabaseClient && window.initSupabaseClient());
          if (sb) {
            var query = sb.from('articles').select('*').eq('slug', slug).eq('status', 'published').or('is_deleted.is.null,is_deleted.eq.false');
            var res = await query.maybeSingle();
            if (!res.error && res.data && res.data.title) {
              return res.data;
            }
          }
        } catch(e) {}
      }

      // Direct Supabase REST Fallback for public slug only
      if (!id && slug) {
        try {
          if (typeof PRIVATIAN_SUPABASE_URL !== 'undefined' && typeof PRIVATIAN_SUPABASE_KEY !== 'undefined') {
            var filter = 'slug=eq.' + encodeURIComponent(slug) + '&status=eq.published';
            var res = await fetch(PRIVATIAN_SUPABASE_URL + '/rest/v1/articles?' + filter + '&or=(is_deleted.is.null,is_deleted.eq.false)&select=*', {
              headers: {
                'apikey': PRIVATIAN_SUPABASE_KEY,
                'Authorization': 'Bearer ' + PRIVATIAN_SUPABASE_KEY
              }
            });
            if (res.ok) {
              var arr = await res.json();
              if (arr && arr[0] && arr[0].title) return arr[0];
            }
          }
        } catch(e) {}
      }

      throw new Error('Article not found');
    }

    fetchArticleData()
      .then(function(a){
        if (!a || !a.title) throw new Error('Article not found');

        // Render Draft Preview Mode Banner if draft or preview parameter
        if (a.status === 'draft' || isPreview || id) {
          var prevBanner = g('preview-mode-bar');
          if (!prevBanner) {
            prevBanner = document.createElement('div');
            prevBanner.id = 'preview-mode-bar';
            prevBanner.style.cssText = 'background:#fffbeb;border-bottom:1px solid #fde68a;padding:10px 16px;text-align:center;font-size:12.5px;font-weight:600;color:#92400e;display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.06);flex-wrap:wrap;';
            prevBanner.innerHTML = `
              <span style="display:inline-flex;align-items:center;gap:6px;">
                <span style="width:8px;height:8px;border-radius:50%;background:#eab308;display:inline-block;"></span>
                <strong>DRAFT PREVIEW MODE</strong> (Article ID: <code style="font-family:monospace;background:#fde68a;padding:2px 6px;border-radius:4px;color:#78350f;">${a.id || id}</code>)
              </span>
              <span style="color:#d97706;">•</span>
              <span style="font-weight:400;">This preview reflects the draft version and is not publicly visible on the live site.</span>
              <a href="/admin-article-editor.html?id=${encodeURIComponent(a.id || id)}" style="display:inline-flex;align-items:center;gap:4px;background:#d97706;color:#fff;padding:4px 12px;border-radius:4px;text-decoration:none;font-size:11.5px;font-weight:600;margin-left:6px;">
                Edit in Article Editor
              </a>
            `;
            document.body.insertBefore(prevBanner, document.body.firstChild);
          }
        }

        // ── <head> meta & SEO tags ──
        var pageTitle = (a.seo_title || a.title || 'Article') + ' — The Privatian Family';
        var pageDesc = a.meta_description || a.deck || 'The Privatian Family — Insights, Stories & Heritage.';
        var pageUrl = location.origin + (a.slug ? '/article/' + a.slug : '/article.html?id=' + encodeURIComponent(a.id || id));
        var pageImg = a.hero_img_url || (location.origin + '/img1.png');

        document.title = pageTitle;

        function setMetaTag(attr, key, val) {
          if (!val) return;
          var el = document.querySelector('meta[' + attr + '="' + key + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, key);
            document.head.appendChild(el);
          }
          el.setAttribute('content', val);
        }

        setMetaTag('name', 'description', pageDesc);

        // Canonical Tag
        var canEl = document.querySelector('link[rel="canonical"]');
        if (!canEl) {
          canEl = document.createElement('link');
          canEl.setAttribute('rel', 'canonical');
          document.head.appendChild(canEl);
        }
        canEl.setAttribute('href', pageUrl);

        // Open Graph Tags
        setMetaTag('property', 'og:type', 'article');
        setMetaTag('property', 'og:site_name', 'The Privatian Family');
        setMetaTag('property', 'og:title', a.seo_title || a.title || '');
        setMetaTag('property', 'og:description', pageDesc);
        setMetaTag('property', 'og:url', pageUrl);
        setMetaTag('property', 'og:image', pageImg);
        if (a.published_at) setMetaTag('property', 'article:published_time', new Date(a.published_at).toISOString());
        if (a.updated_at) setMetaTag('property', 'article:modified_time', new Date(a.updated_at).toISOString());
        if (a.section) setMetaTag('property', 'article:section', a.section);
        if (a.author) setMetaTag('property', 'article:author', a.author);

        // Twitter / X Card Tags
        setMetaTag('name', 'twitter:card', 'summary_large_image');
        setMetaTag('name', 'twitter:title', a.seo_title || a.title || '');
        setMetaTag('name', 'twitter:description', pageDesc);
        setMetaTag('name', 'twitter:image', pageImg);

        // Google Structured Data (JSON-LD Schema for NewsArticle)
        try {
          var oldLd = document.getElementById('article-jsonld');
          if (oldLd) oldLd.remove();

          var schemaData = {
            "@context": "https://schema.org",
            "@type": "NewsArticle",
            "mainEntityOfPage": {
              "@type": "WebPage",
              "@id": pageUrl
            },
            "headline": a.title || pageTitle,
            "description": pageDesc,
            "image": a.hero_img_url ? [a.hero_img_url] : [],
            "datePublished": a.published_at || a.created_at || new Date().toISOString(),
            "dateModified": a.updated_at || a.published_at || a.created_at || new Date().toISOString(),
            "author": [{
              "@type": "Person",
              "name": a.author || "The Privatian Family",
              "jobTitle": a.author_role || undefined
            }],
            "publisher": {
              "@type": "Organization",
              "name": "The Privatian Family",
              "logo": {
                "@type": "ImageObject",
                "url": location.origin + "/logo.png"
              }
            },
            "articleSection": a.section || "General",
            "keywords": a.tags ? a.tags.split(',').map(function(t){ return t.trim(); }).filter(function(t){ return !t.startsWith('feat_pos:'); }).join(', ') : ""
          };

          var ldScript = document.createElement('script');
          ldScript.id = 'article-jsonld';
          ldScript.type = 'application/ld+json';
          ldScript.text = JSON.stringify(schemaData, null, 2);
          document.head.appendChild(ldScript);
        } catch(e) {}

        var _currentArticle = a;

        function renderArticleContent(art) {
          if (!art) return;
          var isBn = window.PrivatianLang && window.PrivatianLang.getLang() === 'bn';

          // ── Section pill & breadcrumb ──
          var crumbHome = document.querySelector('.breadcrumb-home');
          if (crumbHome) crumbHome.textContent = isBn ? 'মূল পাতা' : 'Home';

          var secRaw = art.section || '';
          var secDisplay = isBn ? (art.section_bn || (window.PrivatianLang && window.PrivatianLang.getSectionName ? window.PrivatianLang.getSectionName(secRaw, 'bn') : (window.PrivatianLang && window.PrivatianLang.translateStatic ? window.PrivatianLang.translateStatic(secRaw, 'bn') : secRaw))) : (window.PrivatianLang && window.PrivatianLang.getSectionName ? window.PrivatianLang.getSectionName(secRaw, 'en') : secRaw);
          var secSlug = slugify(secRaw);
          var secHref = secRaw ? '/section/' + secSlug : '/';
          var pill = g('article-section-pill');
          var secLink = g('article-section-link');
          if(pill){
            pill.textContent = secDisplay || '';
            pill.href = secHref;
            pill.style.display = secDisplay ? 'inline-block' : 'none';
          }
          if(secLink){
            secLink.textContent = secDisplay || (isBn ? 'মূল পাতা' : 'Home');
            secLink.href = secHref;
          }

          // ── Headline, deck ──
          var title = isBn ? (art.title_bn || art.title || '') : (art.title || '');
          var deckText = isBn ? (art.deck_bn !== undefined ? art.deck_bn : art.deck) : (art.deck || '');
          var headline = g('article-headline');
          if(headline) headline.textContent = title;
          var deck = g('article-deck');
          if(deck){
            deck.textContent = deckText;
            deck.style.display = deckText ? '' : 'none';
          }

          // ── Meta row ──
          var authName = isBn ? (art.author_bn || art.author || '') : (art.author || '');
          var byLabel = isBn ? (window.PrivatianLang ? window.PrivatianLang.t('by') : 'লিখেছেন') : 'By';
          var authEl = g('article-author');
          if(authEl) authEl.innerHTML = authName ? (byLabel + ' <strong>' + escapeHtml(authName) + '</strong>') : '';

          var dateEl = g('article-date');
          var rawDate = art.published_at || art.created_at;
          if(dateEl) {
            dateEl.textContent = window.PrivatianLang ? window.PrivatianLang.formatDisplayDate(rawDate) : fmt(rawDate);
          }

          var contentHtml = isBn ? (art.content_html_bn || art.content_html || '') : (art.content_html || '');
          var rtEl = g('article-readtime');
          if(rtEl) {
            var minutes = readTime(contentHtml);
            rtEl.textContent = window.PrivatianLang ? window.PrivatianLang.formatReadTime(minutes) : (minutes + ' min read');
          }

          // ── Article body ──
          var body = g('article-content');
          if(body){
            body.innerHTML = contentHtml;
          }

          // ── Hero caption & credit ──
          var cap = g('article-hero-caption');
          if(cap){
            var capText = isBn ? (art.hero_caption_bn || art.hero_caption || '') : (art.hero_caption || '');
            var credText = isBn ? (art.hero_credit_bn || art.hero_credit || '') : (art.hero_credit || '');
            var credit  = credText ? '<span class="caption-credit">' + escapeHtml(credText) + '</span>' : '';
            cap.innerHTML = escapeHtml(capText) + (credit ? ' ' + credit : '');
            cap.style.display = (capText || credText) ? '' : 'none';
          }

          // ── Author bio ──
          var bioWrap = g('article-author-bio');
          var bioName = g('author-bio-name');
          var bioRole = g('author-bio-role');
          var bioDesc = g('author-bio-desc');
          var bioAvatar = g('author-bio-avatar');

          var bName = isBn ? (art.author_bn || art.author || '') : (art.author || '');
          var bRole = isBn ? (art.author_role_bn || art.author_role || '') : (art.author_role || '');
          var bDesc = isBn ? (art.author_bio_bn || art.author_bio || '') : (art.author_bio || '');

          if (bioWrap) {
            if (!bName && !bDesc) {
              bioWrap.style.display = 'none';
            } else {
              bioWrap.style.display = '';
              if(bioName) bioName.textContent = bName;
              if(bioRole) bioRole.textContent = bRole;
              if(bioDesc) bioDesc.textContent = bDesc;
              if(bioAvatar && art.author_photo_url){
                bioAvatar.innerHTML = '<img src="' + art.author_photo_url + '" alt="' + escapeHtml(bName) + '" style="width:52px;height:52px;border-radius:50%;object-fit:cover;" />';
              }
            }
          }

          // ── Related heading ──
          var relH = document.querySelector('.related-heading');
          if (relH) relH.textContent = isBn ? (window.PrivatianLang ? window.PrivatianLang.t('relatedArticles') : 'সম্পর্কিত প্রতিবেদন') : 'Related Stories';

          // ── Document Title ──
          var siteSuffix = isBn ? 'দ্য প্রাইভেটিয়ান ফ্যামিলি' : 'The Privatian Family';
          document.title = (title || 'Article') + ' — ' + siteSuffix;
        }

        function escapeHtml(text) {
          return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        renderArticleContent(a);

        // Reactive language switch listener
        document.addEventListener('privatian:language-changed', function() {
          if (_currentArticle) renderArticleContent(_currentArticle);
        });

        // ── Hero / Featured image & positioning ──
        var featPos = 'top';
        if (a.tags) {
          var posMatch = a.tags.match(/feat_pos:(top|middle|bottom|hidden)/);
          if (posMatch) featPos = posMatch[1];
        }

        var heroImg = g('article-hero-img');
        var fig = g('article-hero-figure');
        var mainBody = g('article-body');
        var body = g('article-content');
        if(heroImg && fig){
          if(a.hero_img_url && featPos !== 'hidden'){
            heroImg.src = a.hero_img_url;
            heroImg.alt = a.hero_img_alt || a.title || '';
            fig.style.display = '';

            // Reposition figure according to selected placement
            if (featPos === 'middle' && body) {
              var pList = body.querySelectorAll('p');
              if (pList.length >= 3) {
                var midIdx = Math.floor(pList.length / 2);
                pList[midIdx - 1].after(fig);
              } else if (pList.length > 0) {
                pList[0].after(fig);
              } else {
                body.prepend(fig);
              }
            } else if (featPos === 'bottom' && body) {
              body.append(fig);
            } else {
              // Default Top placement
              if (mainBody && body) {
                mainBody.insertBefore(fig, body);
              }
            }
          } else {
            fig.style.display = 'none';
          }
        }

        // ── Reveal page content now (main data loaded) ──
        revealPage();

        // ── Related articles (same section, exclude self) ──
        var secSlug = slugify(a.section || '');
        fetch('/api/articles?action=public&section=' + secSlug + '&limit=4')
          .then(function(r){ return r.json(); })
          .then(function(list){
            var others = Array.isArray(list) ? list.filter(function(x){ return x.id !== a.id; }).slice(0,3) : [];
            var grid = g('related-grid');
            var relSec = g('article-related');
            if(grid && relSec && others.length){
              relSec.style.display = '';
              var isBn = window.PrivatianLang && window.PrivatianLang.getLang() === 'bn';
              grid.innerHTML = others.map(function(r){
                var rSlug = slugify(r.section||'');
                var artUrl = r.slug ? '/article/' + r.slug : '/article/' + r.id;
                var thumb = r.hero_img_url
                  ? '<img src="'+r.hero_img_url+'" alt="" class="related-card-img" loading="lazy" />'
                  : '<div style="width:100%;height:100%;background:#e8f1f9"></div>';
                var rDate = window.PrivatianLang ? window.PrivatianLang.formatDisplayDate(r.published_at) : fmt(r.published_at);
                var rTitle = isBn ? (r.title_bn || r.title) : r.title;
                var rSecName = isBn ? (r.section_bn || (window.PrivatianLang && window.PrivatianLang.getSectionName ? window.PrivatianLang.getSectionName(r.section || '', 'bn') : (r.section || ''))) : (r.section || '');
                return '<article class="related-card">'
                  +'<a href="'+artUrl+'" class="related-card-img-link"><div class="related-card-img-wrap">'+thumb+'</div></a>'
                  +'<div class="related-card-body">'
                  +'<a href="/section/'+rSlug+'" class="related-card-section">'+escapeHtml(rSecName)+'</a>'
                  +'<h3 class="related-card-title"><a href="'+artUrl+'" class="related-card-title-link">'+escapeHtml(rTitle)+'</a></h3>'
                  +'<div class="related-card-meta">'+rDate+'</div>'
                  +'</div></article>';
              }).join('');
            } else if(relSec){
              relSec.style.display = 'none';
            }
          }).catch(function(){});
      })
      .catch(function(e){
        // Hide skeleton
        var sk = g('article-skeleton'); if (sk) sk.style.display = 'none';
        // Keep hero band hidden (don't reveal placeholder content)
        var band = g('article-hero-band'); if (band) band.style.display = 'none';
        var layout = g('article-layout'); if (layout) layout.style.display = 'none';
        var related = g('article-related'); if (related) related.style.display = 'none';
        // Show full-page error
        var err = document.createElement('div');
        err.style.cssText = 'max-width:520px;margin:80px auto;padding:0 24px;text-align:center;';
        err.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.2" width="56" height="56" style="margin:0 auto 20px;display:block;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
          + '<h2 style="font-family:var(--font-serif,\'Libre Baskerville\',serif);font-size:22px;color:#1a2d3e;margin:0 0 10px;">Article not available</h2>'
          + '<p style="font-family:var(--font-sans,\'Source Sans 3\',sans-serif);font-size:14px;color:#9ca3af;margin:0 0 24px;line-height:1.6;">This article may not be published yet, or the link may be incorrect.</p>'
          + '<a href="/" style="font-family:var(--font-sans,\'Source Sans 3\',sans-serif);font-size:13px;font-weight:600;color:#0a528e;text-decoration:none;">← Back to Home</a>';
        document.body.appendChild(err);
      });
  })();

  /* ── Share buttons ── */
  function shareArticle(platform) {
    var headline = document.getElementById('article-headline');
    var url = encodeURIComponent(window.location.href);
    var title = encodeURIComponent(headline ? headline.textContent.trim() : '');
    var urls = {
      twitter:  'https://twitter.com/intent/tweet?url=' + url + '&text=' + title,
      facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + url,
      linkedin: 'https://www.linkedin.com/sharing/share-offsite/?url=' + url,
      email:    'mailto:?subject=' + title + '&body=' + url
    };
    if (platform === 'copy') {
      navigator.clipboard.writeText(window.location.href).then(function() {
        var btn = document.getElementById('share-copy');
        if (btn) {
          btn.style.color = 'var(--brand-navy,#0a528e)';
          setTimeout(function() { btn.style.color = ''; }, 1500);
        }
      });
      return;
    }
    if (urls[platform]) window.open(urls[platform], '_blank', 'width=600,height=400');
  }

  /* ── Share sidebar visibility ── */
  (function() {
    var sidebar = document.getElementById('article-share-sidebar');
    var band = document.getElementById('article-hero-band');
    function onScroll() {
      if (!band || !sidebar) return;
      sidebar.classList.toggle('is-visible', band.getBoundingClientRect().bottom < 80);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();

  /* ── Reading progress bar ── */
  (function() {
    var bar = document.createElement('div');
    bar.id = 'read-progress';
    bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;background:var(--brand-navy,#0a528e);z-index:9999;width:0%;transition:width 0.1s;pointer-events:none;';
    document.body.appendChild(bar);
    window.addEventListener('scroll', function() {
      var body = document.getElementById('article-body');
      if (!body) return;
      var rect = body.getBoundingClientRect();
      var total = rect.height - window.innerHeight;
      var scrolled = Math.max(0, -rect.top);
      bar.style.width = Math.min(100, (scrolled / total) * 100) + '%';
    }, { passive: true });
  })();
  </script>
