<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Editor — The Privatian Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/article.css" />
  <style>
/* ── RESET / VARS ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a528e;--dark:#0d1f35;--bg:#f0f4f8;--card:#fff;
  --border:#e2e8f0;--text:#1a2d3e;--muted:#6b7f92;--light:#9db5c3;
  --serif:'Libre Baskerville',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --tb:52px;--fmt:46px;--col:720px;
}
html,body{min-height:100%}
body{font-family:var(--sans);background:var(--bg);padding-top:calc(var(--tb)+var(--fmt));color:var(--text)}

/* ── ADMIN TOOLBAR ───────────────────────────── */
#tb{position:fixed;top:0;left:0;right:0;height:var(--tb);z-index:1000;
  background:var(--dark);display:flex;align-items:center;gap:8px;padding:0 18px;
  box-shadow:0 2px 16px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.05)}
.tb-back{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.5);
  text-decoration:none;font:600 11px/1 var(--sans);letter-spacing:.04em;
  padding:7px 11px;border-radius:6px;transition:.15s;flex-shrink:0}
.tb-back:hover{background:rgba(255,255,255,.09);color:#fff}
.tb-vr{width:1px;height:24px;background:rgba(255,255,255,.1);flex-shrink:0}
.tb-slug-g{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tb-lbl{font:700 9px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.28);flex-shrink:0}
#tb-slug{font:400 12px/1 var(--sans);color:rgba(255,255,255,.65);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:5px;padding:5px 10px;outline:none;width:200px;transition:.15s}
#tb-slug:focus{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff}
.tb-badge{font:700 9px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;flex-shrink:0}
.tb-badge.draft{background:rgba(251,191,36,.12);color:#fbbf24}
.tb-badge.published{background:rgba(52,211,153,.12);color:#34d399}
#tb-save-st{font:400 10px/1 var(--sans);color:rgba(255,255,255,.22);
  min-width:90px;flex-shrink:0;white-space:nowrap}
.tb-btn{font:600 12px/1 var(--sans);border:none;border-radius:6px;
  padding:7px 14px;cursor:pointer;flex-shrink:0;transition:.15s;white-space:nowrap}
.tb-preview{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12)}
.tb-preview:hover{background:rgba(255,255,255,.13);color:#fff}
.tb-save{background:rgba(10,82,142,.9);color:#fff}.tb-save:hover{background:#0a528e}
.tb-save:disabled{opacity:.4;cursor:default}
.tb-pub{background:#1a7a4a;color:#fff}.tb-pub:hover{background:#158040}
.tb-unpub{background:rgba(220,38,38,.8);color:#fff}.tb-unpub:hover{background:#dc2626}

/* ── FORMAT BAR ──────────────────────────────── */
#fmt{position:fixed;top:var(--tb);left:0;right:0;height:var(--fmt);z-index:900;
  background:#fff;border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;gap:1px;padding:0 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05)}
#fmt-block{font:600 11.5px/1 var(--sans);color:var(--text);
  background:#f8fafc;border:1px solid #dde4ea;border-radius:6px;
  padding:5px 9px;cursor:pointer;outline:none;margin-right:6px;transition:.12s}
#fmt-block:hover{background:#eef2f7}
.fs{width:1px;height:22px;background:#dde4ea;margin:0 5px}
.fb{width:32px;height:32px;border:none;border-radius:6px;background:none;
  cursor:pointer;color:#4a5568;display:flex;align-items:center;justify-content:center;
  font:600 13px/1 var(--sans);transition:.12s;position:relative}
.fb:hover{background:#eef2f7;color:var(--navy)}
.fb.on{background:#e8f1f9;color:var(--navy)}
.fb svg{pointer-events:none}
/* color pickers */
.fc-wrap{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fc-wrap input[type=color]{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.fc-ico{width:32px;height:32px;border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  color:#4a5568;font:700 13px/1 var(--sans);gap:2px;transition:.12s}
.fc-wrap:hover .fc-ico{background:#eef2f7;color:var(--navy)}
.fc-sw{height:3px;width:18px;border-radius:2px}

/* ── RESTORE BANNER ──────────────────────────── */
#restore-banner{display:none;background:#fef3c7;border-bottom:1px solid #fbbf24;
  padding:10px 20px;font:400 13px/1.4 var(--sans);color:#92400e;
  position:sticky;top:calc(var(--tb)+var(--fmt));z-index:800;
  display:none;align-items:center;gap:10px}
#restore-banner.show{display:flex}
.rb-btns{display:flex;gap:8px;margin-left:auto}
.rb-btn{font:600 12px/1 var(--sans);padding:5px 12px;border-radius:6px;
  cursor:pointer;border:1px solid;transition:.12s}
.rb-restore{background:#92400e;color:#fff;border-color:#92400e}
.rb-restore:hover{background:#78350f}
.rb-discard{background:transparent;color:#92400e;border-color:#fbbf24}
.rb-discard:hover{background:rgba(146,64,14,.08)}

/* ── CANVAS ──────────────────────────────────── */
#canvas{max-width:var(--col);margin:24px auto 80px;border-radius:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.06);overflow:hidden}

/* HEADER card */
#ed-hdr{background:var(--card);padding:40px 48px 32px;border-bottom:1px solid #f0ece8}

/* Section picker */
.sec-wrap{position:relative;display:inline-block;margin-bottom:20px}
#sec-pill{display:inline-flex;align-items:center;gap:6px;
  font:700 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:var(--navy);padding:5px 13px 5px 14px;
  border-radius:3px;cursor:pointer;user-select:none;transition:opacity .15s}
#sec-pill:hover{opacity:.82}
#sec-dd{display:none;position:absolute;top:calc(100%+8px);left:0;z-index:500;
  background:#fff;border:1px solid #dde4ea;border-radius:10px;
  box-shadow:0 10px 32px rgba(0,0,0,.13);min-width:200px;overflow:hidden}
#sec-dd.open{display:block}
.sec-opt{padding:11px 18px;font:600 13px/1 var(--sans);color:#374151;cursor:pointer;transition:.1s}
.sec-opt:hover{background:#f0f5fa;color:var(--navy)}
.sec-opt.sel{background:#e8f1f9;color:var(--navy)}

/* Headline / Deck */
.ed-h1{font:700 clamp(26px,4vw,44px)/1.18 var(--serif);color:var(--dark);
  letter-spacing:-.012em;outline:none;margin-bottom:14px;min-height:1.2em;word-break:break-word}
.ed-deck{font:400 clamp(15px,2vw,20px)/1.55 var(--serif);color:#4a6070;font-style:italic;
  outline:none;margin-bottom:22px;min-height:1.6em;word-break:break-word}

/* Meta row — INLINE so date auto-sizes */
.ed-meta{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;
  font:400 13px/1.4 var(--sans);color:var(--muted);
  padding-top:18px;border-top:1px solid #e4ddd5}
.ed-meta .by{color:var(--dark);font-weight:600}
.meta-dot{color:#b8c8d2;padding:0 2px}
.ed-inline{display:inline;outline:none;cursor:text;white-space:nowrap;
  border-bottom:1px dashed #c0ccd8;padding-bottom:1px;min-width:2ch}
.ed-inline:focus{border-bottom-color:var(--navy)}
#ed-author{font-weight:600;color:var(--dark)}
#ed-date{color:var(--muted)}

/* BODY card */
#ed-body{background:var(--card);padding:40px 48px 48px;border-bottom:1px solid #f0ece8}

/* Rich text area */
#ed-rt{outline:none;font:400 18.5px/1.78 var(--serif);color:#1a2d3e;
  min-height:360px;caret-color:var(--navy);word-break:break-word}
#ed-rt:empty::before{content:'Start writing your article here…\A\AUse the toolbar above to format text, insert headings,\Aquotes, or images anywhere in the body.';
  white-space:pre;color:#b0c0cc;pointer-events:none;font-style:italic;font-size:17px}
#ed-rt p{margin:0 0 1.5em}
#ed-rt h2{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--navy);margin:2.4em 0 .9em;padding-top:1.4em;border-top:2px solid var(--navy)}
#ed-rt h3{font:700 22px/1.3 var(--serif);color:var(--dark);margin:2em 0 .7em}
#ed-rt blockquote{margin:2em 0;padding:16px 24px;border-left:4px solid var(--navy);
  background:#f0f5fa;border-radius:0 8px 8px 0;font-style:italic;color:#3a5568}
#ed-rt blockquote p{margin:0}
#ed-rt a{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
#ed-rt hr{border:none;border-top:2px solid #e4ddd5;margin:2.5em 0}
#ed-rt figure{margin:2em 0;text-align:center}
#ed-rt figcaption{font:400 12px/1.5 var(--sans);color:var(--muted);
  border-top:1px solid var(--border);padding-top:8px;text-align:left;outline:none;
  cursor:text;min-height:1em}
#ed-rt figcaption:empty::before{content:attr(data-ph);color:#b0c0cc;pointer-events:none}
#ed-rt mark{background:#fff176;border-radius:2px;padding:0 2px}
#ed-rt code{font-family:monospace;background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.87em}
#ed-rt pre{background:#1a2d3e;color:#e2e8f0;padding:20px 24px;border-radius:8px;
  overflow-x:auto;font:400 14px/1.65 monospace;margin:2em 0}

/* Image selection state */
#ed-rt img{max-width:100%;border-radius:3px;display:block;margin:0 auto;
  cursor:pointer;transition:outline .15s}
#ed-rt img.ed-img-sel{outline:3px solid var(--navy);outline-offset:3px}

/* IMAGE TOOLBAR (floating) */
#img-tb{display:none;position:fixed;z-index:9990;
  background:var(--dark);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.35);padding:6px 10px;
  align-items:center;gap:4px;white-space:nowrap}
#img-tb.show{display:flex}
.it-grp{display:flex;align-items:center;gap:2px}
.it-vr{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 5px}
.it-btn{font:600 11px/1 var(--sans);padding:5px 10px;border:none;border-radius:6px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);cursor:pointer;transition:.12s}
.it-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.it-btn.on{background:var(--navy);color:#fff}
.it-del{background:rgba(220,38,38,.7);color:#fff}
.it-del:hover{background:#dc2626}
.it-icon-btn{width:28px;height:28px;border:none;border-radius:6px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.it-icon-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.it-icon-btn svg{pointer-events:none}

/* BIO card */
#ed-bio{background:var(--card);padding:28px 48px 40px}
.bio-card{display:grid;grid-template-columns:64px 1fr;gap:20px;
  align-items:start;background:#f7f9fb;border:1px solid #e4eaf0;
  border-radius:10px;padding:22px 24px}
/* Author photo */
#author-photo-zone{width:64px;height:64px;border-radius:50%;overflow:hidden;
  cursor:pointer;position:relative;flex-shrink:0}
#author-photo-zone:hover::after{content:'📷';position:absolute;inset:0;
  background:rgba(13,31,53,.55);display:flex;align-items:center;justify-content:center;
  font-size:22px;border-radius:50%}
#author-photo-zone img{width:100%;height:100%;object-fit:cover;display:block}
#author-photo-zone svg{display:block}
.bio-fields{display:flex;flex-direction:column;gap:6px}
.bio-f{outline:none;padding-bottom:3px;border-bottom:1px dashed #c5d4de}
.bio-f:focus{border-bottom-color:var(--navy)}
.bio-name{font:700 15px/1.3 var(--sans);color:var(--dark);min-height:20px}
.bio-role{font:600 12px/1.3 var(--sans);color:#5a7a9a;letter-spacing:.04em;min-height:18px}
.bio-desc{font:400 13.5px/1.55 var(--sans);color:#4a6070;min-height:42px}

/* FLOATING SELECTION TOOLBAR */
#sel-tb{position:fixed;z-index:9999;background:var(--dark);border-radius:9px;
  box-shadow:0 6px 24px rgba(0,0,0,.4);padding:5px 8px;display:none;
  align-items:center;gap:2px}
#sel-tb.show{display:flex}
.stb{width:28px;height:26px;border:none;background:none;cursor:pointer;
  color:rgba(255,255,255,.7);border-radius:5px;font:700 12px/1 var(--sans);
  display:flex;align-items:center;justify-content:center;transition:.1s}
.stb:hover{background:rgba(255,255,255,.15);color:#fff}
.stb-v{width:1px;height:16px;background:rgba(255,255,255,.18);margin:0 3px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:99999;
  font:600 13px/1.3 var(--sans);background:var(--dark);color:#fff;
  padding:12px 20px;border-radius:10px;max-width:320px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);transform:translateY(80px);opacity:0;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .22s}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-left:4px solid #34d399}
#toast.err{border-left:4px solid #f87171}
#toast.info{border-left:4px solid #60a5fa}

/* Placeholder helper */
[contenteditable][data-ph]:empty::before{content:attr(data-ph);
  color:#b0c0cc;pointer-events:none;font-weight:400;font-style:italic}
.ed-h1[data-ph]:empty::before{font-style:normal}

/* Hide public elements */
#site-header-mount,#site-footer-mount,.article-share-sidebar,
.article-related,.article-right-aside{display:none!important}
  </style>
</head>
<body>

<!-- ═══ ADMIN TOOLBAR ════════════════════════════════════════════ -->
<div id="tb">
  <a href="admin.html#articles" class="tb-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Articles
  </a>
  <div class="tb-vr"></div>
  <div class="tb-slug-g">
    <span class="tb-lbl">Slug</span>
    <input type="text" id="tb-slug" placeholder="article-slug" />
  </div>
  <div class="tb-vr"></div>
  <span class="tb-badge draft" id="tb-badge">● Draft</span>
  <span id="tb-save-st"></span>
  <div class="tb-vr"></div>
  <button class="tb-btn tb-preview" onclick="previewArt()">Preview</button>
  <button class="tb-btn tb-save" id="tb-save-btn" onclick="saveArt()">Save Draft</button>
  <button class="tb-btn tb-pub" id="tb-pub-btn" onclick="pubArt()">Publish</button>
</div>

<!-- ═══ FORMAT BAR ═══════════════════════════════════════════════ -->
<div id="fmt">

  <!-- Undo / Redo -->
  <button class="fb" onmousedown="f(event,'undo')" title="Undo (Ctrl+Z)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M3 13A9 9 0 1 0 6 6.7L3 9"/></svg>
  </button>
  <button class="fb" onmousedown="f(event,'redo')" title="Redo (Ctrl+Y)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M21 13A9 9 0 1 1 18 6.7L21 9"/></svg>
  </button>

  <div class="fs"></div>

  <!-- Block format -->
  <select id="fmt-block" title="Block format" onchange="setBlock(this.value)">
    <option value="p">Paragraph</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
    <option value="blockquote">Block Quote</option>
    <option value="pre">Code Block</option>
  </select>

  <div class="fs"></div>

  <button class="fb" id="fb-b" onmousedown="f(event,'bold')"          title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="fb" id="fb-i" onmousedown="f(event,'italic')"        title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="fb" id="fb-u" onmousedown="f(event,'underline')"     title="Underline"><u>U</u></button>
  <button class="fb" id="fb-s" onmousedown="f(event,'strikeThrough')" title="Strikethrough"><s>S</s></button>

  <div class="fs"></div>

  <!-- Text color -->
  <div class="fc-wrap" title="Text color">
    <input type="color" id="fc-txt" value="#000000" onchange="fv(event,'foreColor',this.value,'sw-txt')" />
    <div class="fc-ico">A<span class="fc-sw" id="sw-txt" style="background:#000"></span></div>
  </div>

  <!-- Highlight -->
  <div class="fc-wrap" title="Highlight color">
    <input type="color" id="fc-hl" value="#ffff00" onchange="fv(event,'hiliteColor',this.value,'sw-hl')" />
    <div class="fc-ico" style="font-size:16px;">🖍<span class="fc-sw" id="sw-hl" style="background:#ff0"></span></div>
  </div>

  <div class="fs"></div>

  <!-- Link / unlink -->
  <button class="fb" onmousedown="insLink(event)" title="Insert link (Ctrl+K)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
  </button>
  <button class="fb" onmousedown="f(event,'unlink')" title="Remove link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18.84 12.25 1.72-1.71a4.5 4.5 0 0 0-6.37-6.37L12.5 5.86"/><path d="m5.17 11.75-1.72 1.71a4.5 4.5 0 0 0 6.37 6.37L11.5 18.14"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
  </button>

  <div class="fs"></div>

  <!-- Image insert -->
  <button class="fb" onmousedown="trigImg(event)" title="Insert image at cursor">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5-4 4-2-2-5 5"/></svg>
  </button>

  <!-- HR -->
  <button class="fb" onmousedown="insHR(event)" title="Divider">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div class="fs"></div>

  <!-- Clear format -->
  <button class="fb" onmousedown="f(event,'removeFormat')" title="Clear formatting">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21 9-18M3 6h18M3 12h10M3 18h6"/></svg>
  </button>
</div>

<!-- Hidden inputs -->
<input type="file" id="img-inp" accept="image/*" style="display:none" onchange="handleImgFile(this)" />
<input type="file" id="author-photo-inp" accept="image/*" style="display:none" onchange="handleAuthorPhoto(this)" />

<!-- ═══ RESTORE BANNER ═══════════════════════════════════════════ -->
<div id="restore-banner">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
  <span id="rb-msg">You have unsaved local changes.</span>
  <div class="rb-btns">
    <button class="rb-btn rb-restore" onclick="restoreLocal()">Restore</button>
    <button class="rb-btn rb-discard" onclick="discardLocal()">Discard</button>
  </div>
</div>

<!-- ═══ IMAGE TOOLBAR (floating) ════════════════════════════════ -->
<div id="img-tb">
  <span style="font:600 10px/1 var(--sans);color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase;margin-right:4px;">Size</span>
  <div class="it-grp">
    <button class="it-btn" onclick="imgSize('35%')" id="it-s">S</button>
    <button class="it-btn" onclick="imgSize('55%')" id="it-m">M</button>
    <button class="it-btn" onclick="imgSize('75%')" id="it-l">L</button>
    <button class="it-btn" onclick="imgSize('100%')" id="it-f">Full</button>
  </div>
  <div class="it-vr"></div>
  <span style="font:600 10px/1 var(--sans);color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase;margin-right:4px;">Align</span>
  <div class="it-grp">
    <button class="it-icon-btn" onclick="imgAlign('left')" title="Float left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="12" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
    </button>
    <button class="it-icon-btn" onclick="imgAlign('center')" title="Center">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
    <button class="it-icon-btn" onclick="imgAlign('right')" title="Float right">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="12" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div class="it-vr"></div>
  <button class="it-btn it-del" onclick="deleteImg()" title="Delete image">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    Delete
  </button>
</div>

<!-- ═══ ARTICLE CANVAS ══════════════════════════════════════════ -->
<div id="canvas">

  <!-- HEADER -->
  <div id="ed-hdr">
    <div class="sec-wrap" id="sec-wrap">
      <div id="sec-pill" onclick="toggleSecDd(event)">
        <span id="sec-lbl">Select Section</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="sec-dd" id="sec-dd">
        <!-- Populated from API -->
        <div style="padding:12px 18px;font:400 12px/1 var(--sans);color:#9ca3af;">Loading sections…</div>
      </div>
    </div>

    <h1 class="ed-h1" id="ed-headline" contenteditable="true" data-ph="Article headline…" spellcheck="true"></h1>
    <p class="ed-deck" id="ed-deck" contenteditable="true" data-ph="Add a compelling subtitle…"></p>

    <div class="ed-meta">
      <span class="by">By</span>
      <span class="ed-inline" id="ed-author" contenteditable="true" data-ph="Author name"></span>
      <span class="meta-dot">·</span>
      <span class="ed-inline" id="ed-date" contenteditable="true" data-ph="Date"></span>
      <span class="meta-dot">·</span>
      <span id="ed-rtime">— min read</span>
    </div>
  </div>

  <!-- BODY -->
  <div id="ed-body">
    <div id="ed-rt" contenteditable="true" spellcheck="true"
         role="textbox" aria-multiline="true" aria-label="Article body"></div>
  </div>

  <!-- AUTHOR BIO -->
  <div id="ed-bio">
    <div class="bio-card">
      <div id="author-photo-zone" onclick="document.getElementById('author-photo-inp').click()" title="Click to upload author photo">
        <svg id="author-photo-svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="32" fill="#e8f1f9"/>
          <circle cx="32" cy="25" r="11" fill="#0a528e" opacity=".28"/>
          <ellipse cx="32" cy="53" rx="20" ry="11" fill="#0a528e" opacity=".16"/>
        </svg>
        <img id="author-photo-img" src="" alt="" style="display:none;width:64px;height:64px;object-fit:cover;border-radius:50%" />
      </div>
      <div class="bio-fields">
        <div class="bio-f bio-name" contenteditable="true" id="bio-name" data-ph="Author Name"></div>
        <div class="bio-f bio-role" contenteditable="true" id="bio-role" data-ph="Role · Designation"></div>
        <div class="bio-f bio-desc" contenteditable="true" id="bio-desc" data-ph="A short bio about the author…"></div>
      </div>
    </div>
  </div>

</div>

<!-- Selection toolbar -->
<div id="sel-tb">
  <button class="stb" onmousedown="f(event,'bold')"><b>B</b></button>
  <button class="stb" onmousedown="f(event,'italic')"><i>I</i></button>
  <button class="stb" onmousedown="f(event,'underline')"><u>U</u></button>
  <div class="stb-v"></div>
  <button class="stb" onmousedown="insLink(event)">🔗</button>
  <div class="stb-v"></div>
  <button class="stb" onmousedown="f(event,'removeFormat')">✕</button>
</div>

<div id="toast"></div>

<script src="assets/js/admin-auth.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   The Privatian Family — Article Editor v4
   Features: undo/redo, image resize/align/delete,
   sections from DB, localStorage draft, author photo,
   debounced auto-save
════════════════════════════════════════════════════════════ */

let ART_ID  = null;
let STATUS  = 'draft';
let DIRTY   = false;
let SAVING  = false;
let _SEL    = null;   // saved selection for image insert
let _CURIMG = null;   // currently selected image element
let _serverTS = 0;    // server updated_at timestamp

// Debounce timers
let _lsTimer   = null;
let _srvTimer  = null;

// ── BOOT ────────────────────────────────────────────────────
window.addEventListener('privatian:ready', () => {
  ART_ID = new URLSearchParams(location.search).get('id') || null;
  ART_ID ? loadArticle(ART_ID) : initEmpty();

  loadSections();
  bindSelToolbar();
  bindFmtSync();
  bindImgClicks();
  bindInput();

  if (!g('ed-date').textContent.trim())
    g('ed-date').textContent = fmtDate(new Date());

  document.addEventListener('click', globalClick);
});

function initEmpty() {
  checkLocalDraft();
}

// ── LOAD ARTICLE ─────────────────────────────────────────────
async function loadArticle(id) {
  try {
    const r = await api('/api/articles?action=get&id=' + id);
    const a = await r.json();
    if (!r.ok) throw new Error(a.error);
    _serverTS = new Date(a.updated_at || a.created_at || 0).getTime();
    fill(a);
    checkLocalDraft();
  } catch(e) { toast('Failed to load: ' + e.message, 'err'); }
}

function fill(a) {
  ART_ID = a.id; STATUS = a.status || 'draft';
  tx('ed-headline', a.title || '');
  tx('ed-deck',     a.deck  || '');
  tx('ed-author',   a.author      || '');
  tx('ed-date',     a.published_at
    ? fmtDate(new Date(a.published_at))
    : fmtDate(new Date(a.created_at || Date.now())));
  tx('bio-name', a.author      || '');
  tx('bio-role', a.author_role || '');
  tx('bio-desc', a.author_bio  || '');
  g('tb-slug').value = a.slug || '';
  if (a.section) setSec(a.section);
  if (a.content_html) g('ed-rt').innerHTML = a.content_html;
  if (a.author_photo_url) showAuthorPhoto(a.author_photo_url);
  refreshStatus(); updateReadTime();
}

// ── SECTIONS FROM DB ─────────────────────────────────────────
async function loadSections() {
  const dd = g('sec-dd');
  try {
    const r = await api('/api/sections?status=all');
    const list = await r.json();
    const active = (Array.isArray(list) ? list : []).filter(s => !s.deleted);
    if (!active.length) throw new Error('empty');
    dd.innerHTML = active.map(s =>
      `<div class="sec-opt" onclick="setSec('${escH(s.name)}')">${escH(s.name)}</div>`
    ).join('');
  } catch {
    // fallback
    dd.innerHTML = ['Findings','Culture','Heritage','Community &amp; Heritage','Opinion','Archive']
      .map(n => `<div class="sec-opt" onclick="setSec('${n}')">${n}</div>`).join('');
  }
}

function toggleSecDd(ev) {
  ev.stopPropagation();
  g('sec-dd').classList.toggle('open');
}
function setSec(val) {
  g('sec-lbl').textContent = val;
  document.querySelectorAll('.sec-opt').forEach(o => o.classList.toggle('sel', o.textContent.trim() === val));
  g('sec-dd').classList.remove('open');
  DIRTY = true; lsSave();
}

// ── INPUT BINDING (debounced auto-save) ──────────────────────
function bindInput() {
  const targets = ['ed-rt','ed-headline','ed-deck','ed-author','ed-date','bio-name','bio-role','bio-desc'];
  targets.forEach(id => {
    const el = g(id);
    if (!el) return;
    el.addEventListener('input', onInput);
  });
}

function onInput() {
  DIRTY = true;
  updateReadTime();
  // 1. localStorage — 300ms debounce
  clearTimeout(_lsTimer);
  _lsTimer = setTimeout(lsSave, 300);
  // 2. Server — 3s debounce
  clearTimeout(_srvTimer);
  _srvTimer = setTimeout(() => { if (DIRTY) saveArt(true); }, 3000);
  setSaveStatus('Unsaved changes');
}

// ── LOCALSTORAGE DRAFT ───────────────────────────────────────
function lsKey() { return 'pf_draft_' + (ART_ID || 'new'); }

function lsSave() {
  try {
    localStorage.setItem(lsKey(), JSON.stringify({
      ...buildPayload(),
      _ts:      Date.now(),
      _rtHtml:  g('ed-rt').innerHTML,
      _artId:   ART_ID,
    }));
  } catch(e) {}
}

function checkLocalDraft() {
  const raw = localStorage.getItem(lsKey());
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (!d._ts) return;
    // Show banner if localStorage is newer than server
    if (d._ts > _serverTS + 5000) {
      const ago = Math.round((Date.now() - d._ts) / 60000);
      const msg = ago < 1 ? 'just now' : `${ago} minute${ago > 1 ? 's' : ''} ago`;
      g('rb-msg').textContent = `You have unsaved local changes from ${msg}.`;
      g('restore-banner').classList.add('show');
    }
  } catch(e) {}
}

function restoreLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(lsKey()) || '{}');
    if (d._rtHtml) g('ed-rt').innerHTML = d._rtHtml;
    if (d.title)   tx('ed-headline', d.title);
    if (d.deck)    tx('ed-deck',     d.deck);
    if (d.section) setSec(d.section);
    if (d.author)  tx('ed-author',   d.author);
    DIRTY = true;
  } catch(e) { toast('Restore failed', 'err'); }
  g('restore-banner').classList.remove('show');
  toast('Local draft restored', 'ok');
}

function discardLocal() {
  localStorage.removeItem(lsKey());
  g('restore-banner').classList.remove('show');
}

// ── SAVE DRAFT ───────────────────────────────────────────────
async function saveArt(silent = false) {
  if (SAVING) return;
  SAVING = true;
  const btn = g('tb-save-btn');
  if (!silent) { btn.disabled = true; btn.textContent = 'Saving…'; }
  setSaveStatus('Saving…');

  try {
    const r = await api('/api/articles?action=save', { method:'POST', body: JSON.stringify(buildPayload()) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Save failed');

    if (!ART_ID) {
      ART_ID = d.id;
      const u = new URL(location.href); u.searchParams.set('id', ART_ID);
      history.replaceState({}, '', u.toString());
      g('tb-slug').value = d.slug || '';
    }
    _serverTS = Date.now();
    DIRTY = false;
    lsSave(); // update LS with fresh timestamp → banner won't reappear
    setSaveStatus('Saved');
    if (!silent) toast('Draft saved ✓', 'ok');
  } catch(e) {
    setSaveStatus('Save failed');
    if (!silent) toast(e.message || 'Save failed', 'err');
  } finally {
    SAVING = false;
    if (!silent) { btn.disabled = false; btn.textContent = 'Save Draft'; }
  }
}

// ── PUBLISH / UNPUBLISH ──────────────────────────────────────
async function pubArt() {
  if (!ART_ID) { await saveArt(true); if (!ART_ID) { toast('Save failed', 'err'); return; } }
  const btn = g('tb-pub-btn'); btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/api/articles?action=publish&id=' + ART_ID, { method:'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    STATUS = d.status;
    refreshStatus();
    toast(STATUS === 'published' ? '🎉 Article published!' : 'Moved to Draft', 'ok');
  } catch(e) { toast(e.message, 'err'); }
  finally { btn.disabled = false; refreshPubBtn(); }
}

function buildPayload() {
  return {
    id:              ART_ID,
    slug:            g('tb-slug').value.trim() || undefined,
    title:           gt('ed-headline'),
    deck:            gt('ed-deck'),
    section:         g('sec-lbl').textContent === 'Select Section' ? '' : g('sec-lbl').textContent,
    author:          gt('ed-author'),
    author_role:     gt('bio-role'),
    author_bio:      gt('bio-desc'),
    author_photo_url: g('author-photo-img').src && g('author-photo-img').style.display !== 'none' ? g('author-photo-img').src : '',
    hero_img_url:    '',
    hero_caption:    '',
    hero_credit:     '',
    content_html:    g('ed-rt').innerHTML,
  };
}

// ── FORMATTING ────────────────────────────────────────────────
function f(ev, cmd, val) {
  ev.preventDefault();
  document.execCommand(cmd, false, val || null);
  g('ed-rt').focus();
  syncFmt();
}
function fv(ev, cmd, val, swatchId) {
  document.execCommand(cmd, false, val);
  g(swatchId).style.background = val;
  g('ed-rt').focus();
}

function setBlock(tag) {
  g('ed-rt').focus();
  document.execCommand('formatBlock', false, tag);
  syncFmt();
}

function insLink(ev) {
  ev?.preventDefault();
  if (!getSelection().toString()) { toast('Select text first', 'info'); return; }
  const url = prompt('Enter URL:');
  if (url) document.execCommand('createLink', false, url);
}

function insHR(ev) {
  ev.preventDefault();
  g('ed-rt').focus();
  document.execCommand('insertHTML', false, '<hr/>');
}

// ── FORMAT BAR SYNC ──────────────────────────────────────────
function bindFmtSync() {
  document.addEventListener('selectionchange', syncFmt);
}
function syncFmt() {
  [['bold','fb-b'],['italic','fb-i'],['underline','fb-u'],['strikeThrough','fb-s']].forEach(([c,id]) => {
    const el = g(id); if (el) el.classList.toggle('on', document.queryCommandState(c));
  });
  try {
    const v = document.queryCommandValue('formatBlock').toLowerCase().replace(/[<>]/g,'');
    const fb = g('fmt-block');
    if (fb) fb.value = {p:'p',h2:'h2',h3:'h3',blockquote:'blockquote',pre:'pre'}[v] || 'p';
  } catch(e){}
}

// ── IMAGE INSERT AT CURSOR ────────────────────────────────────
function trigImg(ev) {
  ev.preventDefault();
  const sel = getSelection();
  if (sel.rangeCount) _SEL = sel.getRangeAt(0).cloneRange();
  g('img-inp').value = '';
  g('img-inp').click();
}

async function handleImgFile(input) {
  const file = input.files[0]; if (!file) return;

  // Show locally first
  const localUrl = URL.createObjectURL(file);
  insertImgAtCursor(localUrl);

  // Upload via signed URL
  try {
    const r = await api('/api/articles?action=upload', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Upload init failed');

    // PUT file directly to Supabase Storage
    await fetch(d.uploadUrl, {
      method: 'PUT', headers: { 'Content-Type': file.type }, body: file
    });

    // Replace blob src with real URL
    g('ed-rt').querySelectorAll('img').forEach(img => {
      if (img.src === localUrl) img.src = d.publicUrl;
    });
    DIRTY = true; lsSave();
  } catch(e) { toast('Upload failed: ' + e.message, 'err'); }
}

function insertImgAtCursor(url) {
  g('ed-rt').focus();
  if (_SEL) {
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(_SEL);
  }
  const html = `<figure><img src="${url}" alt="" style="width:100%;max-width:100%;border-radius:3px;display:block;margin:0 auto;" /><figcaption contenteditable="true" data-ph="Add caption…"></figcaption></figure><p><br></p>`;
  document.execCommand('insertHTML', false, html);
  bindImgClicks();
}

// ── IMAGE TOOLBAR (click to select) ──────────────────────────
function bindImgClicks() {
  g('ed-rt').querySelectorAll('img').forEach(img => {
    if (img._edBound) return;
    img._edBound = true;
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      selectImg(img);
    });
  });
}

function selectImg(img) {
  // Deselect previous
  if (_CURIMG && _CURIMG !== img) _CURIMG.classList.remove('ed-img-sel');
  _CURIMG = img;
  img.classList.add('ed-img-sel');
  positionImgToolbar(img);
  highlightSizeBtn(img.style.width || '100%');
}

function positionImgToolbar(img) {
  const tb = g('img-tb');
  const r  = img.getBoundingClientRect();
  tb.style.top  = (window.scrollY + r.top - 52) + 'px';
  tb.style.left = (window.scrollX + r.left)       + 'px';
  tb.classList.add('show');
}

function highlightSizeBtn(w) {
  [['it-s','35%'],['it-m','55%'],['it-l','75%'],['it-f','100%']].forEach(([id,val]) => {
    const el = g(id); if (el) el.classList.toggle('on', w === val);
  });
}

function imgSize(w) {
  if (!_CURIMG) return;
  _CURIMG.style.width = w;
  _CURIMG.style.maxWidth = '100%';
  highlightSizeBtn(w);
  DIRTY = true;
}

function imgAlign(align) {
  if (!_CURIMG) return;
  const fig = _CURIMG.closest('figure') || _CURIMG;
  if (align === 'left')   { fig.style.float = 'left';  fig.style.margin = '0 1.5em 1em 0'; }
  if (align === 'right')  { fig.style.float = 'right'; fig.style.margin = '0 0 1em 1.5em'; }
  if (align === 'center') { fig.style.float = '';       fig.style.margin = '2em auto'; }
  DIRTY = true;
}

function deleteImg() {
  if (!_CURIMG) return;
  const fig = _CURIMG.closest('figure') || _CURIMG;
  fig.remove();
  _CURIMG = null;
  g('img-tb').classList.remove('show');
  DIRTY = true;
}

function globalClick(e) {
  // Close section dropdown
  if (!g('sec-wrap').contains(e.target)) g('sec-dd').classList.remove('open');
  // Deselect image if click outside
  if (!g('img-tb').contains(e.target) && !e.target.matches('#ed-rt img')) {
    if (_CURIMG) _CURIMG.classList.remove('ed-img-sel');
    _CURIMG = null;
    g('img-tb').classList.remove('show');
  }
}

// ── AUTHOR PHOTO ─────────────────────────────────────────────
async function handleAuthorPhoto(input) {
  const file = input.files[0]; if (!file) return;
  // Show preview immediately
  const localUrl = URL.createObjectURL(file);
  showAuthorPhoto(localUrl);
  // Upload
  try {
    const r = await api('/api/articles?action=upload', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Upload init failed');
    await fetch(d.uploadUrl, {
      method: 'PUT', headers: { 'Content-Type': file.type }, body: file
    });
    showAuthorPhoto(d.publicUrl);
    DIRTY = true; lsSave();
  } catch(e) { toast('Photo upload failed: ' + e.message, 'err'); }
}

function showAuthorPhoto(url) {
  const img = g('author-photo-img');
  const svg = g('author-photo-svg');
  img.src = url; img.style.display = 'block';
  if (svg) svg.style.display = 'none';
}

// ── SELECTION TOOLBAR ─────────────────────────────────────────
function bindSelToolbar() {
  const tb = g('sel-tb');
  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) {
      tb.classList.remove('show'); return;
    }
    const anc = sel.anchorNode;
    const ce = anc?.nodeType === 3 ? anc.parentElement?.closest('[contenteditable]') : anc?.closest?.('[contenteditable]');
    if (!ce || ce.id === 'tb-slug') { tb.classList.remove('show'); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    tb.style.top  = (scrollY + r.top - 46) + 'px';
    tb.style.left = (scrollX + r.left + r.width/2 - 85) + 'px';
    tb.classList.add('show');
  });
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────
document.addEventListener('keydown', ev => {
  const cm = ev.ctrlKey || ev.metaKey;
  if (cm && ev.key === 's')             { ev.preventDefault(); saveArt(); }
  if (cm && ev.key === 'k')             { ev.preventDefault(); insLink(); }
  if (cm && ev.key === 'z' && !ev.shiftKey) { /* browser handles */ }
  if ((cm && ev.key === 'y') || (cm && ev.shiftKey && ev.key === 'z')) { /* browser handles */ }
  if (ev.key === 'Enter' && ev.target.id === 'ed-headline') { ev.preventDefault(); g('ed-deck').focus(); }
  if (ev.key === 'Enter' && ev.target.id === 'ed-deck')     { ev.preventDefault(); g('ed-rt').focus(); placeEnd(g('ed-rt')); }
});

// ── STATUS / HELPERS ─────────────────────────────────────────
function refreshStatus() {
  const b = g('tb-badge');
  b.className = 'tb-badge ' + STATUS;
  b.textContent = STATUS === 'published' ? '● Published' : '● Draft';
  refreshPubBtn();
}
function refreshPubBtn() {
  const btn = g('tb-pub-btn');
  btn.textContent = STATUS === 'published' ? 'Unpublish' : 'Publish';
  btn.className   = 'tb-btn ' + (STATUS === 'published' ? 'tb-unpub' : 'tb-pub');
}
function setSaveStatus(msg) { g('tb-save-st').textContent = msg; }
function updateReadTime() {
  const wc = (g('ed-rt').innerText||'').replace(/\s+/g,' ').split(' ').filter(Boolean).length;
  g('ed-rtime').textContent = Math.max(1, Math.round(wc/200)) + ' min read';
}
function previewArt() {
  if (!ART_ID) { toast('Save first to preview', 'info'); return; }
  window.open('/article.html?id=' + ART_ID, '_blank');
}

// ── TINY UTILS ────────────────────────────────────────────────
const g   = id   => document.getElementById(id);
const gt  = id   => (g(id)?.textContent || '').trim();
const tx  = (id,v)=> { const el = g(id); if (el) el.textContent = v; };
const fmtDate = d => d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const escH = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function placeEnd(el) {
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function api(url, opts={}) {
  return fetch(url, { ...opts, headers: {
    'Content-Type':'application/json',
    'Authorization':'Bearer ' + window.PRIVATIAN_TOKEN,
    ...(opts.headers||{})
  }});
}
function toast(msg, type='ok') {
  const t = g('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
